<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>互動學習小遊戲樂園 | Mini Games Portal</title>
  <style>
    :root {
      --bg-gradient: linear-gradient(135deg, #fffbeb 0%, #eff6ff 50%, #f5f3ff 100%);
      --card-bg: #ffffff;
      --primary: #4f46e5;
      --primary-hover: #4338ca;
      --primary-light: #eef2ff;
      --accent: #f59e0b;
      --accent-light: #fffbeb;
      --text-main: #1e293b;
      --text-muted: #64748b;
      --border: #e2e8f0;
      --shadow-lg: 0 20px 25px -5px rgba(15, 23, 42, 0.08), 0 8px 10px -6px rgba(15, 23, 42, 0.04);
      --radius-xl: 24px;
      --radius-lg: 18px;
      --radius-md: 12px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans TC", "Microsoft JhengHei", sans-serif;
      background: var(--bg-gradient);
      color: var(--text-main);
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 36px 16px;
    }

    .portal-container {
      width: 100%;
      max-width: 760px;
    }

    /* 頂部橫幅 */
    .hero {
      text-align: center;
      margin-bottom: 32px;
    }

    .hero-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: #ffffff;
      border: 1px solid var(--border);
      padding: 6px 14px;
      border-radius: 999px;
      font-size: 0.82rem;
      font-weight: 800;
      color: var(--primary);
      box-shadow: 0 2px 6px rgba(15, 23, 42, 0.04);
      margin-bottom: 12px;
    }

    .hero-title {
      font-size: 2rem;
      font-weight: 900;
      letter-spacing: -0.02em;
      color: var(--text-main);
      margin-bottom: 8px;
    }

    .hero-subtitle {
      font-size: 0.95rem;
      color: var(--text-muted);
      font-weight: 500;
    }

    /* 遊戲卡片網格 */
    .games-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 18px;
    }

    .game-card {
      background: var(--card-bg);
      border-radius: var(--radius-xl);
      border: 2px solid rgba(255, 255, 255, 0.9);
      box-shadow: var(--shadow-lg);
      padding: 22px;
      text-decoration: none;
      color: inherit;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      transition: all 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
      position: relative;
      overflow: hidden;
    }

    .game-card:hover {
      transform: translateY(-5px);
      border-color: #c7d2fe;
      box-shadow: 0 25px 30px -5px rgba(79, 70, 229, 0.12);
    }

    .game-card.coming-soon {
      opacity: 0.72;
      background: rgba(255, 255, 255, 0.65);
      border: 2px dashed #cbd5e1;
      box-shadow: none;
      cursor: default;
    }

    .game-card.coming-soon:hover {
      transform: none;
    }

    .card-top {
      display: flex;
      align-items: flex-start;
      gap: 14px;
      margin-bottom: 14px;
    }

    .game-icon {
      width: 56px;
      height: 56px;
      border-radius: 16px;
      background: linear-gradient(135deg, #f59e0b 0%, #d97706 100%);
      color: #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 28px;
      flex-shrink: 0;
      box-shadow: 0 6px 14px rgba(245, 158, 11, 0.28);
    }

    .game-icon.placeholder {
      background: #e2e8f0;
      color: #64748b;
      box-shadow: none;
    }

    .game-meta {
      flex: 1;
    }

    .game-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-bottom: 6px;
    }

    .tag {
      font-size: 0.7rem;
      font-weight: 800;
      padding: 2px 8px;
      border-radius: 999px;
      background: var(--primary-light);
      color: var(--primary);
    }

    .tag.amber {
      background: var(--accent-light);
      color: #b45309;
    }

    .tag.muted {
      background: #f1f5f9;
      color: #64748b;
    }

    .game-title {
      font-size: 1.2rem;
      font-weight: 900;
      color: var(--text-main);
    }

    .game-desc {
      font-size: 0.86rem;
      color: var(--text-muted);
      line-height: 1.55;
      margin-bottom: 18px;
    }

    .card-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding-top: 12px;
      border-top: 1px solid #f1f5f9;
    }

    .play-cta {
      font-size: 0.9rem;
      font-weight: 800;
      color: var(--primary);
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .play-btn-circle {
      width: 34px;
      height: 34px;
      border-radius: 50%;
      background: var(--primary);
      color: #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.85rem;
      transition: transform 0.15s ease;
    }

    .game-card:hover .play-btn-circle {
      transform: scale(1.1);
      background: var(--primary-hover);
    }

    .footer-note {
      text-align: center;
      margin-top: 36px;
      font-size: 0.78rem;
      color: var(--text-muted);
    }
  </style>
</head>
<body>
  <div class="portal-container">
    <header class="hero">
      <div class="hero-badge">🎮 Kids Learning & Mini Games</div>
      <h1 class="hero-title">互動學習小遊戲樂園</h1>
      <p class="hero-subtitle">點擊下方卡片，立即開始趣味練習與挑戰！</p>
    </header>

    <main class="games-grid">
      <!-- 遊戲 1：珠心算小達人 -->
      <a href="./abacus-mental-math.html" class="game-card">
        <div>
          <div class="card-top">
            <div class="game-icon">🧮</div>
            <div class="game-meta">
              <div class="game-tags">
                <span class="tag amber">珠心算教學</span>
                <span class="tag">加減心算</span>
              </div>
              <h2 class="game-title">珠心算小達人</h2>
            </div>
          </div>
          <p class="game-desc">
            結合日式 1 上珠 4 下珠互動算盤！支援「看數撥珠（個位～千位）」、「看盤認數」以及「個位數加減法口訣（直加直減、湊五破五、進十退十）」循序漸進練習。
          </p>
        </div>
        <div class="card-footer">
          <span class="play-cta">進入遊戲挑戰</span>
          <span class="play-btn-circle">▶</span>
        </div>
      </a>

      <!-- 預留位置：敬請期待 -->
      <div class="game-card coming-soon">
        <div>
          <div class="card-top">
            <div class="game-icon placeholder">✨</div>
            <div class="game-meta">
              <div class="game-tags">
                <span class="tag muted">規劃中</span>
              </div>
              <h2 class="game-title">更多小遊戲開發中...</h2>
            </div>
          </div>
          <p class="game-desc">
            未來將陸續新增更多有趣的數學、邏輯與記憶訓練互動小遊戲，敬請期待！
          </p>
        </div>
        <div class="card-footer">
          <span class="play-cta" style="color: #94a3b8;">Coming Soon</span>
        </div>
      </div>
    </main>

    <footer class="footer-note">
      支援電腦、平板與手機直接開啟遊玩 · 自動記錄最佳成績
    </footer>
  </div>
</body>
</html>
