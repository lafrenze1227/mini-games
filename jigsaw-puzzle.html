<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>繽紛拼圖小達人 - 3x3 / 4x4 / 5x5 互動拼圖</title>
  <style>
    :root {
      --bg-gradient: linear-gradient(135deg, #090d16 0%, #0f172a 50%, #161e31 100%);
      --card-bg: #1e293b;
      --surface: #0f172a;
      --surface-hover: #263449;
      --primary: #6366f1;
      --primary-hover: #4f46e5;
      --primary-light: rgba(99, 102, 241, 0.18);
      --secondary: #10b981;
      --secondary-light: rgba(16, 185, 129, 0.18);
      --accent: #f59e0b;
      --accent-light: rgba(245, 158, 11, 0.18);
      --danger: #ef4444;
      --text-main: #f1f5f9;
      --text-muted: #94a3b8;
      --border: #334155;
      --shadow-lg: 0 20px 28px -5px rgba(0, 0, 0, 0.55), 0 8px 12px -6px rgba(0, 0, 0, 0.4);
      --radius-xl: 24px;
      --radius-lg: 16px;
      --radius-md: 12px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans TC", "Microsoft JhengHei", sans-serif;
      background: var(--bg-gradient);
      color: var(--text-main);
      min-height: 100dvh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 12px;
    }

    .app-container {
      width: 100%;
      max-width: 560px;
      background: var(--card-bg);
      border-radius: var(--radius-xl);
      box-shadow: var(--shadow-lg);
      padding: 18px 20px;
      position: relative;
      border: 1px solid var(--border);
    }

    /* 頂部列 */
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 14px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .brand-icon {
      width: 40px;
      height: 40px;
      border-radius: 12px;
      background: linear-gradient(135deg, #ec4899 0%, #8b5cf6 100%);
      color: #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 21px;
      box-shadow: 0 4px 10px rgba(236, 72, 153, 0.25);
    }

    .brand-title {
      font-size: 1.18rem;
      font-weight: 800;
      letter-spacing: -0.02em;
    }

    .brand-subtitle {
      font-size: 0.74rem;
      color: var(--text-muted);
      font-weight: 500;
    }

    .icon-btn {
      width: 38px;
      height: 38px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text-main);
      font-size: 1.02rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      text-decoration: none;
      transition: all 0.15s ease;
    }

    .icon-btn:hover {
      background: var(--surface-hover);
    }

    .screen {
      display: none;
      animation: fadeIn 0.22s ease;
    }

    .screen.active {
      display: block;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(5px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* 首頁設定 */
    .section-label {
      font-size: 0.82rem;
      font-weight: 800;
      color: #cbd5e1;
      margin-bottom: 8px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    /* 10 張預設圖片畫廊 + 自選上傳 */
    .gallery-grid {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 8px;
      margin-bottom: 16px;
    }

    .pic-card {
      border: 2.5px solid var(--border);
      border-radius: 12px;
      overflow: hidden;
      background: var(--surface);
      cursor: pointer;
      transition: all 0.16s ease;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 4px;
      position: relative;
    }

    .pic-card:hover {
      transform: translateY(-2px);
      border-color: #475569;
    }

    .pic-card.selected {
      border-color: var(--primary);
      background: var(--primary-light);
      box-shadow: 0 4px 12px rgba(99, 102, 241, 0.25);
    }

    .pic-thumb {
      width: 100%;
      aspect-ratio: 1 / 1;
      border-radius: 8px;
      object-fit: cover;
      display: block;
      background: #1e293b;
    }

    .pic-name {
      font-size: 0.68rem;
      font-weight: 800;
      margin-top: 4px;
      color: var(--text-main);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 100%;
    }

    .pic-card.selected .pic-name {
      color: #c7d2fe;
    }

    .upload-btn-inline {
      font-size: 0.74rem;
      font-weight: 800;
      color: #c7d2fe;
      background: var(--primary-light);
      border: 1px solid var(--primary);
      padding: 4px 10px;
      border-radius: 999px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }

    .upload-btn-inline:hover {
      filter: brightness(1.1);
    }

    /* 難度選擇 */
    .size-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      margin-bottom: 14px;
    }

    .option-card {
      border: 2px solid var(--border);
      background: var(--surface);
      border-radius: var(--radius-md);
      padding: 10px 8px;
      text-align: center;
      cursor: pointer;
      transition: all 0.15s ease;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2px;
    }

    .option-card:hover {
      border-color: #475569;
      background: var(--surface-hover);
    }

    .option-card.selected {
      border-color: var(--primary);
      background: var(--primary-light);
      color: #c7d2fe;
    }

    .option-title {
      font-size: 0.95rem;
      font-weight: 900;
    }

    .option-desc {
      font-size: 0.7rem;
      color: var(--text-muted);
    }

    .option-card.selected .option-desc {
      color: #a5b4fc;
    }

    .best-record-box {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      padding: 9px 14px;
      margin-bottom: 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.8rem;
    }

    .best-record-label {
      color: var(--text-muted);
      font-weight: 700;
    }

    .best-record-value {
      font-weight: 800;
      color: #fbbf24;
    }

    .primary-btn {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: var(--radius-lg);
      background: var(--primary);
      color: white;
      font-size: 1.05rem;
      font-weight: 800;
      cursor: pointer;
      box-shadow: 0 8px 15px -3px rgba(79, 70, 229, 0.35);
      transition: all 0.15s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .primary-btn:hover {
      background: var(--primary-hover);
      transform: translateY(-1px);
    }

    /* ====== 遊戲進行畫面 ====== */
    .hud-bar {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin-bottom: 10px;
    }

    .hud-item {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      padding: 7px 6px;
      text-align: center;
    }

    .hud-label {
      font-size: 0.66rem;
      color: var(--text-muted);
      font-weight: 700;
    }

    .hud-value {
      font-size: 1.02rem;
      font-weight: 800;
      font-variant-numeric: tabular-nums;
    }

    .hud-value.highlight { color: #818cf8; }
    .hud-value.good { color: #34d399; }

    /* 輔助工具列 (底圖浮水印、編號、偷看原圖) */
    .assist-toolbar {
      display: flex;
      gap: 8px;
      margin-bottom: 10px;
    }

    .tool-btn {
      flex: 1;
      padding: 8px 6px;
      border-radius: 10px;
      border: 1.5px solid var(--border);
      background: var(--surface);
      color: var(--text-main);
      font-size: 0.76rem;
      font-weight: 800;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
      transition: all 0.15s ease;
    }

    .tool-btn:hover {
      background: var(--surface-hover);
    }

    .tool-btn.active {
      border-color: var(--primary);
      background: var(--primary-light);
      color: #c7d2fe;
    }

    /* 拼圖棋盤外框 */
    .board-container {
      width: 100%;
      max-width: 440px;
      aspect-ratio: 1 / 1;
      margin: 0 auto 12px;
      background: #090d16;
      border-radius: var(--radius-lg);
      padding: 6px;
      position: relative;
      border: 1px solid var(--border);
      box-shadow: 0 12px 24px -6px rgba(0, 0, 0, 0.5);
      touch-action: none; /* 防止拖曳拼圖時手機畫面跟著捲動 */
    }

    /* 淡淡的背景底圖浮水印 */
    .board-watermark {
      position: absolute;
      inset: 6px;
      border-radius: 11px;
      background-size: 100% 100%;
      background-position: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s ease;
      z-index: 1;
    }

    .board-watermark.show {
      opacity: 0.26;
    }

    /* 按住偷看完整原圖遮罩 */
    .board-peek-overlay {
      position: absolute;
      inset: 6px;
      border-radius: 11px;
      background-size: 100% 100%;
      background-position: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.18s ease;
      z-index: 25;
      box-shadow: inset 0 0 0 3px var(--accent);
    }

    .board-peek-overlay.show {
      opacity: 1;
    }

    /* 拼圖網格 */
    .puzzle-grid {
      position: relative;
      z-index: 5;
      width: 100%;
      height: 100%;
      display: grid;
      gap: 3px;
      border-radius: 11px;
      overflow: hidden;
    }

    .puzzle-grid.solved {
      gap: 0px;
    }

    .puzzle-tile {
      position: relative;
      width: 100%;
      height: 100%;
      background-repeat: no-repeat;
      border-radius: 6px;
      cursor: grab;
      transition: transform 0.14s ease, box-shadow 0.14s ease, border-radius 0.25s ease;
      box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.35);
      overflow: hidden;
    }

    .puzzle-grid.solved .puzzle-tile {
      border-radius: 0;
      box-shadow: none;
    }

    .puzzle-tile:active {
      cursor: grabbing;
    }

    /* 點選第一塊準備交換的高亮狀態 */
    .puzzle-tile.selected-tile {
      box-shadow: inset 0 0 0 3.5px #f59e0b, 0 0 12px rgba(245, 158, 11, 0.6);
      z-index: 8;
      transform: scale(0.96);
    }

    /* 拖曳經過的目標格高亮狀態 */
    .puzzle-tile.drop-target {
      box-shadow: inset 0 0 0 3.5px #6366f1;
      filter: brightness(1.12);
    }

    /* 正在被拖曳的原格子半透明 */
    .puzzle-tile.dragging-source {
      opacity: 0.35;
    }

    /* 編號提示標籤 */
    .tile-number {
      position: absolute;
      top: 5px;
      left: 5px;
      min-width: 22px;
      height: 22px;
      padding: 0 5px;
      border-radius: 6px;
      background: rgba(15, 23, 42, 0.78);
      color: #ffffff;
      font-size: 0.72rem;
      font-weight: 800;
      display: none;
      align-items: center;
      justify-content: center;
      pointer-events: none;
      backdrop-filter: blur(2px);
    }

    .puzzle-grid.show-numbers .tile-number {
      display: inline-flex;
    }

    .puzzle-tile.in-place .tile-number {
      background: rgba(16, 185, 129, 0.88);
    }

    /* 跟隨手指/滑鼠移動的浮動拼圖塊 */
    .drag-floating-clone {
      position: fixed;
      pointer-events: none;
      z-index: 9999;
      border-radius: 10px;
      box-shadow: 0 18px 30px rgba(0, 0, 0, 0.55), 0 0 0 3px #ffffff;
      transform: translate(-50%, -50%) scale(1.06);
      background-repeat: no-repeat;
    }

    .game-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.75rem;
      color: var(--text-muted);
    }

    .quit-btn {
      background: none;
      border: none;
      color: var(--text-muted);
      font-weight: 800;
      font-size: 0.8rem;
      cursor: pointer;
      padding: 5px 10px;
      border-radius: 8px;
    }

    .quit-btn:hover {
      background: var(--surface);
      color: var(--text-main);
    }

    /* 過關結算畫面 */
    .result-hero {
      text-align: center;
      padding: 6px 0 14px;
    }

    .result-preview-img {
      width: 150px;
      height: 150px;
      border-radius: 18px;
      margin: 8px auto 12px;
      display: block;
      box-shadow: 0 10px 20px rgba(0, 0, 0, 0.35);
      border: 3px solid var(--border);
      object-fit: cover;
    }

    .result-badge {
      display: inline-block;
      padding: 4px 12px;
      border-radius: 999px;
      background: var(--accent-light);
      color: #fbbf24;
      font-size: 0.8rem;
      font-weight: 800;
      margin-bottom: 4px;
    }

    .result-title {
      font-size: 1.45rem;
      font-weight: 900;
    }

    .stats-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
      margin-bottom: 16px;
    }

    .stat-box {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      padding: 12px;
      text-align: center;
    }

    .stat-box-label {
      font-size: 0.74rem;
      color: var(--text-muted);
      font-weight: 600;
      margin-bottom: 2px;
    }

    .stat-box-val {
      font-size: 1.25rem;
      font-weight: 900;
      color: #818cf8;
    }

    .result-actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .secondary-btn {
      width: 100%;
      padding: 13px;
      border: 2px solid var(--border);
      border-radius: var(--radius-lg);
      background: var(--surface);
      color: var(--text-main);
      font-size: 0.95rem;
      font-weight: 800;
      cursor: pointer;
    }

    @media (max-width: 440px) {
      .gallery-grid {
        grid-template-columns: repeat(5, 1fr);
        gap: 5px;
      }
      .pic-name {
        font-size: 0.6rem;
      }
    }
  </style>
</head>
<body>
  <div class="app-container">
    <!-- 頂部列 -->
    <div class="header">
      <div class="brand">
        <div class="brand-icon">🧩</div>
        <div>
          <div class="brand-title">繽紛拼圖小達人</div>
          <div class="brand-subtitle">3x3 · 4x4 · 5x5 手指拖曳互動拼圖</div>
        </div>
      </div>
      <div style="display:flex;gap:6px;">
        <a href="./index.html" class="icon-btn" title="返回遊戲大廳">🏠</a>
        <button id="soundToggleBtn" class="icon-btn" title="切換音效">🔊</button>
      </div>
    </div>

    <!-- 畫面 1：首頁選圖與難度設定 -->
    <div id="startScreen" class="screen active">
      <div class="section-label">
        <span>1. 選擇喜歡的圖案（共 10 款主題）</span>
        <label class="upload-btn-inline">
          <span>📷 上傳自己的照片</span>
          <input type="file" id="customImgInput" accept="image/*" style="display:none;">
        </label>
      </div>

      <div class="gallery-grid" id="galleryGrid"></div>

      <div class="section-label">
        <span>2. 選擇拼圖格數難度</span>
      </div>
      <div class="size-grid" id="sizeSelector">
        <div class="option-card selected" data-size="3">
          <span class="option-title">🌱 3 × 3</span>
          <span class="option-desc">共 9 塊 (初學推薦)</span>
        </div>
        <div class="option-card" data-size="4">
          <span class="option-title">⭐ 4 × 4</span>
          <span class="option-desc">共 16 塊 (進階挑戰)</span>
        </div>
        <div class="option-card" data-size="5">
          <span class="option-title">👑 5 × 5</span>
          <span class="option-desc">共 25 塊 (拼圖大師)</span>
        </div>
      </div>

      <div class="best-record-box">
        <span class="best-record-label" id="bestRecordLabel">3 × 3 最快完成紀錄</span>
        <span class="best-record-value" id="bestRecordValue">尚無紀錄</span>
      </div>

      <button id="startBtn" class="primary-btn">
        <span>開始拼圖挑戰</span>
        <span>▶</span>
      </button>
    </div>

    <!-- 畫面 2：遊戲進行 -->
    <div id="gameScreen" class="screen">
      <div class="hud-bar">
        <div class="hud-item">
          <div class="hud-label">歸位進度</div>
          <div class="hud-value good" id="hudProgress">0 / 9</div>
        </div>
        <div class="hud-item">
          <div class="hud-label">移動步數</div>
          <div class="hud-value highlight" id="hudMoves">0</div>
        </div>
        <div class="hud-item">
          <div class="hud-label">已用時間</div>
          <div class="hud-value" id="hudTime">0.0s</div>
        </div>
      </div>

      <!-- 輔助工具列 -->
      <div class="assist-toolbar">
        <button id="toggleWatermarkBtn" class="tool-btn active" title="在棋盤底部顯示淡淡的原圖輔助對位">
          <span>🖼️ 底圖浮水印：開</span>
        </button>
        <button id="toggleNumbersBtn" class="tool-btn" title="顯示每塊拼圖的順序編號">
          <span>🔢 編號提示：關</span>
        </button>
        <button id="peekOriginalBtn" class="tool-btn" title="按住可偷看完整原圖">
          <span>👀 按住看原圖</span>
        </button>
      </div>

      <!-- 拼圖主棋盤 -->
      <div class="board-container" id="boardContainer">
        <div class="board-watermark show" id="boardWatermark"></div>
        <div class="puzzle-grid" id="puzzleGrid"></div>
        <div class="board-peek-overlay" id="boardPeekOverlay"></div>
      </div>

      <div class="game-footer">
        <span>💡 用手指/滑鼠<b>拖曳拼圖</b>或<b>點兩塊拼圖</b>即可交換位置</span>
        <button id="quitBtn" class="quit-btn">換圖 / 返回</button>
      </div>
    </div>

    <!-- 畫面 3：過關結算 -->
    <div id="resultScreen" class="screen">
      <div class="result-hero">
        <span id="resultBadge" class="result-badge">🎉 拼圖完成！</span>
        <div class="result-title" id="resultTitle">太厲害了，完美還原！</div>
        <img id="resultPreviewImg" class="result-preview-img" alt="完成作品">
      </div>

      <div class="stats-grid">
        <div class="stat-box">
          <div class="stat-box-label">完成耗時</div>
          <div class="stat-box-val" id="statTime">15.2 秒</div>
        </div>
        <div class="stat-box">
          <div class="stat-box-label">交換步數</div>
          <div class="stat-box-val" id="statMoves">12 步</div>
        </div>
      </div>

      <div class="result-actions">
        <button id="backHomeBtn" class="secondary-btn">換張圖玩</button>
        <button id="nextPicBtn" class="primary-btn">下一張圖 ▶</button>
      </div>
    </div>
  </div>

  <script>
    // ====== 音效合成器 ======
    class SoundEffects {
      constructor() {
        this.enabled = true;
        this.ctx = null;
      }

      init() {
        if (!this.ctx) {
          const AudioCtx = window.AudioContext || window.webkitAudioContext;
          if (AudioCtx) this.ctx = new AudioCtx();
        }
        if (this.ctx && this.ctx.state === 'suspended') {
          this.ctx.resume();
        }
      }

      playTone(freq, type, duration, delay = 0, gainVal = 0.12) {
        if (!this.enabled) return;
        this.init();
        if (!this.ctx) return;

        const now = this.ctx.currentTime + delay;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(freq, now);

        gain.gain.setValueAtTime(gainVal, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + duration);

        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start(now);
        osc.stop(now + duration);
      }

      pickup() {
        this.playTone(440, 'sine', 0.05, 0, 0.08);
      }

      swap(matchedNewTile) {
        if (matchedNewTile) {
          this.playTone(587.33, 'sine', 0.08, 0, 0.12);
          this.playTone(880, 'sine', 0.14, 0.05, 0.13);
        } else {
          this.playTone(520, 'triangle', 0.06, 0, 0.1);
        }
      }

      win() {

    };

    // ====== 初始化選圖畫廊 ======
    function renderGallery() {
      const container = document.getElementById('galleryGrid');
      container.innerHTML = '';

      PRESET_PICTURES.forEach((pic, idx) => {
        const card = document.createElement('div');
        const isSelected = state.customPicUrl === null && state.selectedPicIdx === idx;
        card.className = `pic-card ${isSelected ? 'selected' : ''}`;
        card.innerHTML = `
          <img class="pic-thumb" src="${pic.url}" alt="${pic.name}">
          <span class="pic-name">${idx + 1}. ${pic.name}</span>
        `;
        card.addEventListener('click', () => {
          state.customPicIdx = null;
          state.customPicUrl = null;
          state.selectedPicIdx = idx;
          renderGallery();
        });
        container.appendChild(card);
      });
    }

    function getCurrentImageUrl() {
      if (state.customPicUrl) return state.customPicUrl;
      return PRESET_PICTURES[state.selectedPicIdx].url;
    }

    // 處理使用者上傳自選圖片（自動裁切為正方形 DataURL）
    document.getElementById('customImgInput').addEventListener('change', (e) => {
      const file = e.target.files && e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = (ev) => {
        const img = new Image();
        img.onload = () => {
          const canvas = document.createElement('canvas');
          const size = 600;
          canvas.width = size;
          canvas.height = size;
          const ctx = canvas.getContext('2d');
          const minSide = Math.min(img.width, img.height);
          const sx = (img.width - minSide) / 2;
          const sy = (img.height - minSide) / 2;
          ctx.drawImage(img, sx, sy, minSide, minSide, 0, 0, size, size);
          state.customPicUrl = canvas.toDataURL('image/jpeg', 0.9);
          renderGallery();
          startGame();
        };
        img.src = ev.target.result;
      };
      reader.readAsDataURL(file);
    });

    // ====== 最佳紀錄管理 ======
    function getBestRecordKey(size = state.gridSize) {
      return `puzzle_best_time_size_${size}`;
    }

    function updateBestRecordUI() {
      const n = state.gridSize;
      document.getElementById('bestRecordLabel').textContent = `${n} × ${n} 最快完成紀錄`;
      const raw = localStorage.getItem(getBestRecordKey(n));
      document.getElementById('bestRecordValue').textContent = raw ? `${ parseFloat(raw).toFixed(1) } 秒` : '尚無紀錄';
    }

    // ====== 畫面切換 ======
    const screens = {
      start: document.getElementById('startScreen'),
      game: document.getElementById('gameScreen'),
      result: document.getElementById('resultScreen')
    };

    function switchScreen(name) {
      Object.values(screens).forEach(s => s.classList.remove('active'));
      screens[name].classList.add('active');
    }

    // ====== 開始並洗牌拼圖 ======
    function startGame() {
      sfx.init();
      const n = Number(state.gridSize);
      const total = n * n;

      // 產生 0 ~ total-1 並隨機洗牌（確保不會一開始就剛好排好）
      state.tiles = Array.from({ length: total }, (_, i) => i);
      do {
        for (let i = total - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          [state.tiles[i], state.tiles[j]] = [state.tiles[j], state.tiles[i]];
        }
      } while (state.tiles.every((val, idx) => val === idx));

      state.selectedTilePos = null;
      state.moves = 0;
      state.isPlaying = true;
      state.startTimeMs = performance.now();
      state.elapsedMs = 0;

      const imgUrl = getCurrentImageUrl();
      document.getElementById('boardWatermark').style.backgroundImage = `url("${imgUrl}")`;
      document.getElementById('boardPeekOverlay').style.backgroundImage = `url("${imgUrl}")`;

      const gridEl = document.getElementById('puzzleGrid');
      gridEl.classList.remove('solved');
      gridEl.style.gridTemplateColumns = `repeat(${n}, 1fr)`;
      gridEl.style.gridTemplateRows = `repeat(${n}, 1fr)`;

      renderBoard();
      updateHud();
      switchScreen('game');

      clearInterval(state.timerId);
      state.timerId = setInterval(() => {
        if (!state.isPlaying) return;
        state.elapsedMs = performance.now() - state.startTimeMs;
        document.getElementById('hudTime').textContent = `${(state.elapsedMs / 1000).toFixed(1)}s`;
      }, 100);
    }

    // ====== 渲染拼圖棋盤 ======
    function renderBoard() {
      const n = Number(state.gridSize);
      const gridEl = document.getElementById('puzzleGrid');
      const imgUrl = getCurrentImageUrl();
      gridEl.innerHTML = '';

      state.tiles.forEach((pieceId, posIdx) => {
        const tile = document.createElement('div');
        tile.className = 'puzzle-tile';
        if (pieceId === posIdx) tile.classList.add('in-place');
        if (state.selectedTilePos === posIdx) tile.classList.add('selected-tile');

        tile.dataset.pos = posIdx;

        // 計算該拼圖塊在原圖中的百分比位置
        const origRow = Math.floor(pieceId / n);
        const origCol = pieceId % n;
        const xPercent = (origCol / (n - 1)) * 100;
        const yPercent = (origRow / (n - 1)) * 100;

        tile.style.backgroundImage = `url("${imgUrl}")`;
        tile.style.backgroundSize = `${n * 100}% ${n * 100}%`;
        tile.style.backgroundPosition = `${xPercent}% ${yPercent}%`;

        const numBadge = document.createElement('span');
        numBadge.className = 'tile-number';
        numBadge.textContent = pieceId + 1;
        tile.appendChild(numBadge);

        gridEl.appendChild(tile);
      });
    }

    // 交換兩個位置的拼圖塊
    function swapTiles(posA, posB) {
      if (!state.isPlaying || posA === posB) return;

      [state.tiles[posA], state.tiles[posB]] = [state.tiles[posB], state.tiles[posA]];
      state.moves++;
      state.selectedTilePos = null;

      const matchedNow = (state.tiles[posA] === posA) || (state.tiles[posB] === posB);
      sfx.swap(matchedNow);

      renderBoard();
      updateHud();

      // 檢查是否全部拼對
      if (state.tiles.every((pieceId, idx) => pieceId === idx)) {
        onPuzzleSolved();
      }
    }

    function updateHud() {
      const n = Number(state.gridSize);
      const total = n * n;
      const inPlaceCount = state.tiles.filter((pieceId, idx) => pieceId === idx).length;
      document.getElementById('hudProgress').textContent = `${inPlaceCount} / ${total}`;
      document.getElementById('hudMoves').textContent = `${state.moves}`;
    }

    function onPuzzleSolved() {
      state.isPlaying = false;
      clearInterval(state.timerId);
      sfx.win();

      const gridEl = document.getElementById('puzzleGrid');
      gridEl.classList.add('solved');

      const totalSec = Number((state.elapsedMs / 1000).toFixed(1));
      const bestKey = getBestRecordKey();
      const prevBest = localStorage.getItem(bestKey);
      let isNewRecord = false;
      if (!prevBest || totalSec < parseFloat(prevBest)) {
        localStorage.setItem(bestKey, String(totalSec));
        isNewRecord = true;
      }

      setTimeout(() => {
        document.getElementById('resultBadge').textContent = isNewRecord ? '🏆 刷新最快紀錄！' : '🎉 拼圖完成！';
        document.getElementById('resultPreviewImg').src = getCurrentImageUrl();
        document.getElementById('statTime').textContent = `${totalSec.toFixed(1)} 秒`;
        document.getElementById('statMoves').textContent = `${state.moves} 步`;
        updateBestRecordUI();
        switchScreen('result');
      }, 650);
    }

    // ====== 手指 / 滑鼠拖曳與點擊交換系統 (Pointer Events) ======
    let dragInfo = null;

    const puzzleGridEl = document.getElementById('puzzleGrid');

    puzzleGridEl.addEventListener('pointerdown', (e) => {
      if (!state.isPlaying) return;
      const tileEl = e.target.closest('.puzzle-tile');
      if (!tileEl) return;

      e.preventDefault();
      const fromPos = parseInt(tileEl.dataset.pos, 10);
      const rect = tileEl.getBoundingClientRect();

      dragInfo = {
        fromPos,
        startX: e.clientX,
        startY: e.clientY,
        isDragging: false,
        sourceEl: tileEl,
        floatingEl: null,
        currentTargetPos: null,
        tileWidth: rect.width,
        tileHeight: rect.height
      };
    });

    window.addEventListener('pointermove', (e) => {
      if (!dragInfo || !state.isPlaying) return;

      const dx = e.clientX - dragInfo.startX;
      const dy = e.clientY - dragInfo.startY;

      // 移動超過 6px 視為開始拖曳
      if (!dragInfo.isDragging && Math.hypot(dx, dy) > 6) {
        dragInfo.isDragging = true;
        sfx.pickup();
        dragInfo.sourceEl.classList.add('dragging-source');

        const clone = document.createElement('div');
        clone.className = 'drag-floating-clone';
        clone.style.width = `${dragInfo.tileWidth}px`;
        clone.style.height = `${dragInfo.tileHeight}px`;
        clone.style.backgroundImage = dragInfo.sourceEl.style.backgroundImage;
        clone.style.backgroundSize = dragInfo.sourceEl.style.backgroundSize;
        clone.style.backgroundPosition = dragInfo.sourceEl.style.backgroundPosition;
        document.body.appendChild(clone);
        dragInfo.floatingEl = clone;
      }

      if (dragInfo.isDragging && dragInfo.floatingEl) {
        dragInfo.floatingEl.style.left = `${e.clientX}px`;
        dragInfo.floatingEl.style.top = `${e.clientY}px`;

        // 偵測手指下方是哪一格拼圖
        const elemBelow = document.elementFromPoint(e.clientX, e.clientY);
        const targetTile = elemBelow ? elemBelow.closest('.puzzle-tile') : null;

        document.querySelectorAll('.puzzle-tile.drop-target').forEach(el => el.classList.remove('drop-target'));

        if (targetTile) {
          const targetPos = parseInt(targetTile.dataset.pos, 10);
          if (targetPos !== dragInfo.fromPos) {
            targetTile.classList.add('drop-target');
            dragInfo.currentTargetPos = targetPos;
          } else {
            dragInfo.currentTargetPos = null;
          }
        } else {
          dragInfo.currentTargetPos = null;
        }
      }
    });

    function finishPointerInteraction() {
      if (!dragInfo) return;
      const info = dragInfo;
      dragInfo = null;

      if (info.floatingEl) {
        info.floatingEl.remove();
      }
      if (info.sourceEl) {
        info.sourceEl.classList.remove('dragging-source');
      }
      document.querySelectorAll('.puzzle-tile.drop-target').forEach(el => el.classList.remove('drop-target'));

      if (!state.isPlaying) return;

      if (info.isDragging) {
        // 拖曳放開：若有停在另一塊拼圖上，立即交換
        if (info.currentTargetPos !== null && info.currentTargetPos !== info.fromPos) {
          swapTiles(info.fromPos, info.currentTargetPos);
        }
      } else {
        // 輕點一下（Click / Tap）：支援點兩塊交換
        sfx.pickup();
        if (state.selectedTilePos === null) {
          state.selectedTilePos = info.fromPos;
          renderBoard();
        } else if (state.selectedTilePos === info.fromPos) {
          state.selectedTilePos = null;
          renderBoard();
        } else {
          swapTiles(state.selectedTilePos, info.fromPos);
        }
      }
    }

    window.addEventListener('pointerup', finishPointerInteraction);
    window.addEventListener('pointercancel', finishPointerInteraction);

    // ====== 輔助工具按鈕事件 ======
    document.getElementById('toggleWatermarkBtn').addEventListener('click', (e) => {
      state.showWatermark = !state.showWatermark;
      document.getElementById('boardWatermark').classList.toggle('show', state.showWatermark);
      e.currentTarget.classList.toggle('active', state.showWatermark);
      e.currentTarget.innerHTML = `<span>🖼️ 底圖浮水印：${state.showWatermark ? '開' : '關'}</span>`;
    });

    document.getElementById('toggleNumbersBtn').addEventListener('click', (e) => {
      state.showNumbers = !state.showNumbers;
      document.getElementById('puzzleGrid').classList.toggle('show-numbers', state.showNumbers);
      e.currentTarget.classList.toggle('active', state.showNumbers);
      e.currentTarget.innerHTML = `<span>🔢 編號提示：${state.showNumbers ? '開' : '關'}</span>`;
    });

    const peekBtn = document.getElementById('peekOriginalBtn');
    const peekOverlay = document.getElementById('boardPeekOverlay');
    const showPeek = () => peekOverlay.classList.add('show');
    const hidePeek = () => peekOverlay.classList.remove('show');

    peekBtn.addEventListener('pointerdown', showPeek);
    peekBtn.addEventListener('pointerup', hidePeek);
    peekBtn.addEventListener('pointerleave', hidePeek);
    peekBtn.addEventListener('pointercancel', hidePeek);

    // ====== 首頁與結算按鈕綁定 ======
    document.getElementById('sizeSelector').addEventListener('click', (e) => {
      const card = e.target.closest('.option-card');
      if (!card) return;
      document.querySelectorAll('#sizeSelector .option-card').forEach(c => c.classList.remove('selected'));
      card.classList.add('selected');
      state.gridSize = Number(card.dataset.size);
      updateBestRecordUI();
    });

    document.getElementById('startBtn').addEventListener('click', startGame);

    document.getElementById('quitBtn').addEventListener('click', () => {
      state.isPlaying = false;
      clearInterval(state.timerId);
      switchScreen('start');
    });

    document.getElementById('backHomeBtn').addEventListener('click', () => {
      switchScreen('start');
    });

    document.getElementById('nextPicBtn').addEventListener('click', () => {
      state.customPicUrl = null;
      state.selectedPicIdx = (state.selectedPicIdx + 1) % PRESET_PICTURES.length;
      renderGallery();
      startGame();
    });

    document.getElementById('soundToggleBtn').addEventListener('click', (e) => {
      sfx.enabled = !sfx.enabled;
      e.currentTarget.textContent = sfx.enabled ? '🔊' : '🔇';
    });

    // 初始化
    renderGallery();
    updateBestRecordUI();
  </script>
</body>
</html>
