<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>大家來找碴 - 雙圖場景觀察力大挑戰</title>
  <style>
    :root {
      --bg-gradient: linear-gradient(135deg, #090d16 0%, #0f172a 50%, #161e31 100%);
      --card-bg: #1e293b;
      --surface: #0f172a;
      --surface-hover: #263449;
      --primary: #6366f1;
      --primary-hover: #4f46e5;
      --primary-light: rgba(99, 102, 241, 0.18);
      --secondary: #10b981;
      --secondary-light: rgba(16, 185, 129, 0.18);
      --accent: #f59e0b;
      --accent-light: rgba(245, 158, 11, 0.18);
      --danger: #ef4444;
      --text-main: #f1f5f9;
      --text-muted: #94a3b8;
      --border: #334155;
      --shadow-lg: 0 20px 28px -5px rgba(0, 0, 0, 0.55), 0 8px 12px -6px rgba(0, 0, 0, 0.4);
      --radius-xl: 24px;
      --radius-lg: 16px;
      --radius-md: 12px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans TC", "Microsoft JhengHei", sans-serif;
      background: var(--bg-gradient);
      color: var(--text-main);
      min-height: 100dvh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 12px;
    }

    .app-container {
      width: 100%;
      max-width: 640px;
      background: var(--card-bg);
      border-radius: var(--radius-xl);
      box-shadow: var(--shadow-lg);
      padding: 16px 18px;
      position: relative;
      border: 1px solid var(--border);
    }

    /* 頂部列 */
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .brand-icon {
      width: 40px;
      height: 40px;
      border-radius: 12px;
      background: linear-gradient(135deg, #f97316 0%, #eab308 100%);
      color: #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 21px;
      box-shadow: 0 4px 12px rgba(249, 115, 22, 0.3);
    }

    .brand-title {
      font-size: 1.18rem;
      font-weight: 800;
      letter-spacing: -0.02em;
    }

    .brand-subtitle {
      font-size: 0.74rem;
      color: var(--text-muted);
      font-weight: 500;
    }

    .icon-btn {
      width: 38px;
      height: 38px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text-main);
      font-size: 1.02rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      text-decoration: none;
      transition: all 0.15s ease;
    }

    .icon-btn:hover {
      background: var(--surface-hover);
      border-color: #475569;
    }

    .screen {
      display: none;
      animation: fadeIn 0.22s ease;
    }

    .screen.active {
      display: block;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(5px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* 首頁設定 */
    .section-label {
      font-size: 0.82rem;
      font-weight: 800;
      color: #cbd5e1;
      margin-bottom: 8px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .scene-gallery {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 8px;
      margin-bottom: 14px;
    }

    .scene-card {
      border: 2px solid var(--border);
      background: var(--surface);
      border-radius: 12px;
      padding: 8px 4px;
      text-align: center;
      cursor: pointer;
      transition: all 0.15s ease;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 3px;
    }

    .scene-card:hover {
      border-color: #475569;
      background: var(--surface-hover);
      transform: translateY(-2px);
    }

    .scene-card.selected {
      border-color: var(--primary);
      background: var(--primary-light);
      color: #c7d2fe;
      box-shadow: 0 4px 12px rgba(99, 102, 241, 0.25);
    }

    .scene-emoji {
      font-size: 1.65rem;
      line-height: 1.1;
    }

    .scene-name {
      font-size: 0.7rem;
      font-weight: 800;
      color: var(--text-main);
      white-space: nowrap;
    }

    .scene-card.selected .scene-name {
      color: #c7d2fe;
    }

    .option-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      margin-bottom: 14px;
    }

    .option-card {
      border: 2px solid var(--border);
      background: var(--surface);
      border-radius: var(--radius-md);
      padding: 10px 8px;
      text-align: center;
      cursor: pointer;
      transition: all 0.15s ease;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2px;
    }

    .option-card:hover {
      border-color: #475569;
      background: var(--surface-hover);
    }

    .option-card.selected {
      border-color: var(--primary);
      background: var(--primary-light);
      color: #c7d2fe;
    }

    .option-title {
      font-size: 0.92rem;
      font-weight: 900;
    }

    .option-desc {
      font-size: 0.68rem;
      color: var(--text-muted);
    }

    .option-card.selected .option-desc {
      color: #a5b4fc;
    }

    .best-record-box {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      padding: 9px 14px;
      margin-bottom: 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.8rem;
    }

    .best-record-label {
      color: var(--text-muted);
      font-weight: 700;
    }

    .best-record-value {
      font-weight: 800;
      color: #fbbf24;
    }

    .primary-btn {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: var(--radius-lg);
      background: linear-gradient(135deg, #6366f1 0%, #4f46e5 100%);
      color: white;
      font-size: 1.05rem;
      font-weight: 800;
      cursor: pointer;
      box-shadow: 0 8px 18px -3px rgba(99, 102, 241, 0.4);
      transition: all 0.15s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .primary-btn:hover {
      filter: brightness(1.08);
      transform: translateY(-1px);
    }

    /* 遊戲畫面頂部資訊列 */
    .hud-bar {
      display: grid;
      grid-template-columns: 1.3fr 1fr 1fr;
      gap: 8px;
      margin-bottom: 10px;
    }

    .hud-item {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      padding: 6px 8px;
      text-align: center;
    }

    .hud-label {
      font-size: 0.65rem;
      color: var(--text-muted);
      font-weight: 700;
    }

    .hud-value {
      font-size: 0.98rem;
      font-weight: 800;
      font-variant-numeric: tabular-nums;
    }

    .hud-value.good { color: #34d399; }
    .hud-value.highlight { color: #fbbf24; }

    /* 找到的圓點進度指示 */
    .diff-dots {
      display: inline-flex;
      gap: 5px;
      align-items: center;
      justify-content: center;
      margin-top: 2px;
    }

    .diff-dot {
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: #334155;
      border: 1.5px solid #64748b;
      transition: all 0.2s ease;
    }

    .diff-dot.found {
      background: #10b981;
      border-color: #6ee7b7;
      box-shadow: 0 0 8px rgba(16, 185, 129, 0.6);
      transform: scale(1.12);
    }

    /* 雙圖對照容器 (上下排列，手機與電腦皆清晰好點) */
    .boards-compare {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-bottom: 10px;
    }

    .scene-panel {
      position: relative;
      width: 100%;
      aspect-ratio: 600 / 340;
      background: #090d16;
      border-radius: 14px;
      border: 2px solid var(--border);
      overflow: hidden;
      cursor: crosshair;
      box-shadow: 0 8px 18px rgba(0, 0, 0, 0.4);
      touch-action: manipulation;
    }

    .scene-panel-badge {
      position: absolute;
      top: 7px;
      left: 8px;
      padding: 2px 9px;
      border-radius: 999px;
      background: rgba(15, 23, 42, 0.78);
      border: 1px solid rgba(255, 255, 255, 0.25);
      color: #f8fafc;
      font-size: 0.68rem;
      font-weight: 800;
      z-index: 10;
      pointer-events: none;
      backdrop-filter: blur(3px);
    }

    .scene-panel svg {
      width: 100%;
      height: 100%;
      display: block;
    }

    /* 找對時的綠色圓圈標記與點錯時的紅叉特效 */
    .overlay-layer {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 15;
    }

    .found-ring {
      position: absolute;
      width: 48px;
      height: 48px;
      border-radius: 50%;
      border: 3.5px solid #10b981;
      background: rgba(16, 185, 129, 0.16);
      box-shadow: 0 0 12px rgba(16, 185, 129, 0.8), inset 0 0 8px rgba(255, 255, 255, 0.5);
      transform: translate(-50%, -50%);
      animation: ringPop 0.32s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    @keyframes ringPop {
      0% { transform: translate(-50%, -50%) scale(0.3); opacity: 0; }
      100% { transform: translate(-50%, -50%) scale(1); opacity: 1; }
    }

    .miss-cross {
      position: absolute;
      transform: translate(-50%, -50%);
      color: #ef4444;
      font-size: 1.65rem;
      font-weight: 900;
      text-shadow: 0 2px 6px rgba(0, 0, 0, 0.8);
      animation: crossFade 0.55s ease forwards;
    }

    @keyframes crossFade {
      0% { transform: translate(-50%, -50%) scale(0.5); opacity: 1; }
      40% { transform: translate(-50%, -50%) scale(1.2); opacity: 1; }
      100% { transform: translate(-50%, -50%) scale(1); opacity: 0; }
    }

    .game-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.74rem;
      color: var(--text-muted);
    }

    .quit-btn {
      background: none;
      border: none;
      color: var(--text-muted);
      font-weight: 800;
      font-size: 0.78rem;
      cursor: pointer;
      padding: 4px 8px;
      border-radius: 8px;
    }

    .quit-btn:hover {
      background: var(--surface);
      color: var(--text-main);
    }

    /* 過關結算畫面 */
    .result-hero {
      text-align: center;
      padding: 10px 0 16px;
    }

    .result-badge {
      display: inline-block;
      padding: 4px 12px;
      border-radius: 999px;
      background: var(--accent-light);
      color: #fbbf24;
      font-size: 0.8rem;
      font-weight: 800;
      margin-bottom: 6px;
      border: 1px solid rgba(245, 158, 11, 0.35);
    }

    .result-title {
      font-size: 1.45rem;
      font-weight: 900;
      margin-bottom: 8px;
    }

    .result-stars-big {
      font-size: 2.6rem;
      letter-spacing: 6px;
      margin: 6px 0;
    }

    .stats-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
      margin-bottom: 16px;
    }

    .stat-box {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      padding: 12px;
      text-align: center;
    }

    .stat-box-label {
      font-size: 0.74rem;
      color: var(--text-muted);
      font-weight: 600;
      margin-bottom: 2px;
    }

    .stat-box-val {
      font-size: 1.25rem;
      font-weight: 900;
      color: #818cf8;
    }

    .result-actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .secondary-btn {
      width: 100%;
      padding: 13px;
      border: 2px solid var(--border);
      border-radius: var(--radius-lg);
      background: var(--surface);
      color: var(--text-main);
      font-size: 0.95rem;
      font-weight: 800;
      cursor: pointer;
    }

    .secondary-btn:hover {
      background: var(--surface-hover);
    }

    @media (max-width: 440px) {
      .scene-gallery {
        grid-template-columns: repeat(5, 1fr);
        gap: 5px;
      }
      .scene-name {
        font-size: 0.62rem;
      }
    }
  </style>
</head>
<body>
  <div class="app-container">
    <!-- 頂部列 -->
    <div class="header">
      <div class="brand">
        <div class="brand-icon">🔍</div>
        <div>
          <div class="brand-title">大家來找碴</div>
          <div class="brand-subtitle">雙圖場景比較 · 隨機差異不重複</div>
        </div>
      </div>
      <div style="display:flex;gap:6px;">
        <a href="./index.html" class="icon-btn" title="返回遊戲大廳">🏠</a>
        <button id="soundToggleBtn" class="icon-btn" title="切換音效">🔊</button>
      </div>
    </div>

    <!-- 畫面 1：首頁設定 -->
    <div id="startScreen" class="screen active">
      <div class="section-label">
        <span>1. 選擇探險場景（共 10 大主題，每次重玩差異點隨機改變！）</span>
      </div>
      <div class="scene-gallery" id="sceneGallery"></div>

      <div class="section-label">
        <span>2. 選擇要找出的不同處數量（難度）</span>
      </div>
      <div class="option-grid" id="countSelector">
        <div class="option-card selected" data-count="3">
          <span class="option-title">🌱 找 3 個不同</span>
          <span class="option-desc">輕鬆入門觀察</span>
        </div>
        <div class="option-card" data-count="5">
          <span class="option-title">⭐ 找 5 個不同</span>
          <span class="option-desc">標準眼力挑戰</span>
        </div>
        <div class="option-card" data-count="7">
          <span class="option-title">👑 找 7 個不同</span>
          <span class="option-desc">偵探大師級</span>
        </div>
      </div>

      <div class="best-record-box">
        <span class="best-record-label" id="bestRecordLabel">找 3 個不同最快紀錄</span>
        <span class="best-record-value" id="bestRecordValue">尚無紀錄</span>
      </div>

      <button id="startBtn" class="primary-btn">
        <span>開始找不同！</span>
        <span>▶</span>
      </button>
    </div>

    <!-- 畫面 2：遊戲進行 -->
    <div id="gameScreen" class="screen">
      <div class="hud-bar">
        <div class="hud-item">
          <div class="hud-label" id="hudProgressLabel">已找出 0 / 3 處不同</div>
          <div class="diff-dots" id="diffDots"></div>
        </div>
        <div class="hud-item">
          <div class="hud-label">點錯次數</div>
          <div class="hud-value highlight" id="hudMistakes">0</div>
        </div>
        <div class="hud-item">
          <div class="hud-label">觀察時間</div>
          <div class="hud-value" id="hudTime">0.0s</div>
        </div>
      </div>

      <!-- 上下雙圖比對區（點擊上圖或下圖的不同處皆可） -->
      <div class="boards-compare">
        <div class="scene-panel" id="topPanel">
          <span class="scene-panel-badge">原始圖 A（點擊上圖或下圖的不同處皆可）</span>
          <div id="topSvgHolder" style="width:100%;height:100%;"></div>
          <div class="overlay-layer" id="topOverlay"></div>
        </div>

        <div class="scene-panel" id="bottomPanel">
          <span class="scene-panel-badge">對照圖 B（找出不一樣的地方！）</span>
          <div id="bottomSvgHolder" style="width:100%;height:100%;"></div>
          <div class="overlay-layer" id="bottomOverlay"></div>
        </div>
      </div>

      <div class="game-footer">
        <span>💡 仔細比較顏色、表情、方向或消失的小物件！</span>
        <button id="quitBtn" class="quit-btn">換場景 / 返回</button>
      </div>
    </div>

    <!-- 畫面 3：過關結算 -->
    <div id="resultScreen" class="screen">
      <div class="result-hero">
        <span id="resultBadge" class="result-badge">🎉 全部找出來了！</span>
        <div class="result-title" id="resultTitle">你的眼睛真銳利！</div>
        <div class="result-stars-big" id="resultStarsBig">⭐⭐⭐</div>
      </div>

      <div class="stats-grid">
        <div class="stat-box">
          <div class="stat-box-label">完成時間</div>
          <div class="stat-box-val" id="statTime">15.8 秒</div>
        </div>
        <div class="stat-box">
          <div class="stat-box-label">點錯次數</div>
          <div class="stat-box-val" id="statMistakes">0 次</div>
        </div>
      </div>

      <div class="result-actions">
        <button id="retrySameBtn" class="secondary-btn">同場景重抽題 ↻</button>
        <button id="nextSceneBtn" class="primary-btn">下一個場景 ▶</button>
      </div>
    </div>
  </div>

  <script>
    // ====== 音效合成器 ======
    class SoundEffects {
      constructor() {
        this.enabled = true;
        this.ctx = null;
      }

      init() {
        if (!this.ctx) {
          const AudioCtx = window.AudioContext || window.webkitAudioContext;
          if (AudioCtx) this.ctx = new AudioCtx();
        }
        if (this.ctx && this.ctx.state === 'suspended') {
          this.ctx.resume();
        }
      }

      playTone(freq, type, duration, delay = 0, gainVal = 0.12) {
        if (!this.enabled) return;
        this.init();
        if (!this.ctx) return;

        const now = this.ctx.currentTime + delay;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(freq, now);

        gain.gain.setValueAtTime(gainVal, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + duration);

        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start(now);
        osc.stop(now + duration);
      }

      found() {
        this.playTone(587.33, 'sine', 0.08, 0, 0.13);
        this.playTone(880, 'sine', 0.16, 0.06, 0.15);
      }

      miss() {
        this.playTone(210, 'triangle', 0.12, 0, 0.12);
        this.playTone(165, 'triangle', 0.16, 0.07, 0.12);
      }

      win() {
        const notes = [523.25, 659.25, 783.99, 1046.5];
        notes.forEach((n, idx) => this.playTone(n, 'sine', 0.22, idx * 0.08, 0.14));
      }
    }

    const sfx = new SoundEffects();

    // ====== 10 大主題場景與每個場景 8 個獨立可變物件 (600x340 座標系) ======
    // 每個 spot 定義：id, x, y, r (判定半徑), normal (A圖繪製), diff (B圖當被抽中為差異點時繪製)
    const SCENES = [
      {
        id: 'farm',
        name: '陽光農場',
        emoji: '🐮',
        bg: `
          <rect width="600" height="340" fill="#7dd3fc"/>
          <ellipse cx="140" cy="295" rx="220" ry="95" fill="#4ade80"/>
          <ellipse cx="470" cy="300" rx="240" ry="100" fill="#22c55e"/>
          <!-- 柵欄 -->
          <rect x="30" y="210" width="180" height="10" fill="#fef08a" stroke="#ca8a04" stroke-width="2"/>
          <rect x="30" y="230" width="180" height="10" fill="#fef08a" stroke="#ca8a04" stroke-width="2"/>
          <rect x="50" y="195" width="12" height="55" fill="#fef08a" stroke="#ca8a04" stroke-width="2"/>
          <rect x="115" y="195" width="12" height="55" fill="#fef08a" stroke="#ca8a04" stroke-width="2"/>
          <rect x="180" y="195" width="12" height="55" fill="#fef08a" stroke="#ca8a04" stroke-width="2"/>
        `,
        spots: [
          {
            x: 85, y: 65, r: 42,
            normal: `<circle cx="85" cy="65" r="34" fill="#facc15" stroke="#f97316" stroke-width="6"/><circle cx="74" cy="58" r="4" fill="#7c2d12"/><circle cx="96" cy="58" r="4" fill="#7c2d12"/><path d="M74,72 Q85,82 96,72" fill="none" stroke="#7c2d12" stroke-width="4" stroke-linecap="round"/>`,
            diff:   `<circle cx="85" cy="65" r="34" fill="#fb7185" stroke="#e11d48" stroke-width="6"/><rect x="65" y="52" width="16" height="10" rx="2" fill="#1e293b"/><rect x="89" y="52" width="16" height="10" rx="2" fill="#1e293b"/><line x1="81" y1="57" x2="89" y2="57" stroke="#1e293b" stroke-width="3"/><circle cx="85" cy="74" r="6" fill="#7c2d12"/>`
          },
          {

          },
          {

          },
          {
            x: 515, y: 75, r: 36,
            normal: `<g fill="#ffffff"><circle cx="500" cy="75" r="16"/><circle cx="518" cy="70" r="20"/><circle cx="535" cy="76" r="15"/></g>`,
            diff:   `<circle cx="515" cy="75" r="16" fill="#ffffff"/><circle cx="515" cy="75" r="24" fill="none" stroke="#ffffff" stroke-width="3" stroke-dasharray="6,6"/>`

    // ====== 遊戲狀態 ======
    const state = {
      sceneIdx: 0,
      targetCount: 3,         // 3 | 5 | 7
      activeDiffIndices: [],  // 存放本局被選為「不同點」的 spot 索引
      foundSet: new Set(),    // 已找出的 spot 索引
      mistakes: 0,
      startTimeMs: 0,
      elapsedMs: 0,
      timerId: null,
      isPlaying: false
    };

    // ====== 首頁場景畫廊初始化 ======
    function renderSceneGallery() {
      const container = document.getElementById('sceneGallery');
      container.innerHTML = '';

      SCENES.forEach((sc, idx) => {
        const card = document.createElement('div');
        card.className = `scene-card ${state.sceneIdx === idx ? 'selected' : ''}`;
        card.innerHTML = `
          <span class="scene-emoji">${sc.emoji}</span>
          <span class="scene-name">${idx + 1}. ${sc.name}</span>
        `;
        card.addEventListener('click', () => {
          state.sceneIdx = idx;
          renderSceneGallery();
          updateBestRecordUI();
        });
        container.appendChild(card);
      });
    }

    function getBestKey() {
      return `spotdiff_best_s${state.sceneIdx}_c${state.targetCount}`;
    }

    function updateBestRecordUI() {
      const sc = SCENES[state.sceneIdx];
      document.getElementById('bestRecordLabel').textContent = `【${sc.name}】找 ${state.targetCount} 個最快紀錄`;
      const raw = localStorage.getItem(getBestKey());
      document.getElementById('bestRecordValue').textContent = raw ? `${parseFloat(raw).toFixed(1)} 秒` : '尚無紀錄';
    }

    // ====== 畫面切換 ======
    const screens = {
      start: document.getElementById('startScreen'),
      game: document.getElementById('gameScreen'),
      result: document.getElementById('resultScreen')
    };

    function switchScreen(name) {
      Object.values(screens).forEach(s => s.classList.remove('active'));
      screens[name].classList.add('active');
    }

    // ====== 開始遊戲（隨機抽取 N 個差異點，每次玩都不一樣！） ======
    function startGame() {
      sfx.init();
      clearInterval(state.timerId);

      const sc = SCENES[state.sceneIdx];
      const totalSpots = sc.spots.length; // 8 個候選差異點
      const indices = Array.from({ length: totalSpots }, (_, i) => i);

      // 隨機洗牌抽出 targetCount (3/5/7) 個作為本局的不同處
      for (let i = indices.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [indices[i], indices[j]] = [indices[j], indices[i]];
      }
      state.activeDiffIndices = indices.slice(0, state.targetCount);
      state.foundSet = new Set();
      state.mistakes = 0;
      state.elapsedMs = 0;
      state.isPlaying = true;
      state.startTimeMs = performance.now();

      renderSceneBoards();
      updateHud();
      document.getElementById('hudTime').textContent = '0.0s';
      switchScreen('game');

      state.timerId = setInterval(() => {
        if (!state.isPlaying) return;
        state.elapsedMs = performance.now() - state.startTimeMs;
        document.getElementById('hudTime').textContent = `${(state.elapsedMs / 1000).toFixed(1)}s`;
      }, 100);
    }

    // 組合上圖 (全部繪製 normal) 與下圖 (被抽中的點繪製 diff)
    function renderSceneBoards() {
      const sc = SCENES[state.sceneIdx];
      const diffSet = new Set(state.activeDiffIndices);

      let topSpotsHtml = '';
      let bottomSpotsHtml = '';

      sc.spots.forEach((sp, idx) => {
        topSpotsHtml += `<g data-spot="${idx}">${sp.normal}</g>`;
        const isDiff = diffSet.has(idx);
        bottomSpotsHtml += `<g data-spot="${idx}">${isDiff ? sp.diff : sp.normal}</g>`;
      });

      const topSvg = `<svg viewBox="0 0 600 340" xmlns="http://www.w3.org/2000/svg">${sc.bg}${topSpotsHtml}</svg>`;
      const bottomSvg = `<svg viewBox="0 0 600 340" xmlns="http://www.w3.org/2000/svg">${sc.bg}${bottomSpotsHtml}</svg>`;

      document.getElementById('topSvgHolder').innerHTML = topSvg;
      document.getElementById('bottomSvgHolder').innerHTML = bottomSvg;
      document.getElementById('topOverlay').innerHTML = '';
      document.getElementById('bottomOverlay').innerHTML = '';
    }

    // ====== 點擊偵測邏輯（支援點擊上圖或下圖） ======
    function handlePanelClick(e, panelEl) {
      if (!state.isPlaying) return;

      const rect = panelEl.getBoundingClientRect();
      const clickX = e.clientX - rect.left;
      const clickY = e.clientY - rect.top;

      // 換算回 600 x 340 的 SVG 座標
      const svgX = (clickX / rect.width) * 600;
      const svgY = (clickY / rect.height) * 340;

      const sc = SCENES[state.sceneIdx];
      let hitDiffIdx = -1;

      for (const spotIdx of state.activeDiffIndices) {
        if (state.foundSet.has(spotIdx)) continue;
        const sp = sc.spots[spotIdx];
        const dist = Math.hypot(svgX - sp.x, svgY - sp.y);
        // 寬容點擊判定半徑，讓小朋友手指更容易點中
        if (dist <= sp.r + 12) {
          hitDiffIdx = spotIdx;
          break;
        }
      }

      if (hitDiffIdx !== -1) {
        // 找到了！同時在上下兩張圖標上綠色光圈
        state.foundSet.add(hitDiffIdx);
        sfx.found();
        const sp = sc.spots[hitDiffIdx];
        addFoundRing(sp.x, sp.y);
        updateHud();

        if (state.foundSet.size >= state.targetCount) {
          onAllFound();
        }
      } else {
        // 若點在已經找過的位置上，不扣分也不顯示紅叉
        for (const spotIdx of state.foundSet) {
          const sp = sc.spots[spotIdx];
          if (Math.hypot(svgX - sp.x, svgY - sp.y) <= sp.r + 10) {
            return;
          }
        }

        // 點錯地方：顯示短暫紅叉提醒
        state.mistakes++;
        sfx.miss();
        updateHud();
        addMissCross(panelEl.querySelector('.overlay-layer'), (svgX / 600) * 100, (svgY / 340) * 100);
      }
    }

    function addFoundRing(svgX, svgY) {
      const leftPct = (svgX / 600) * 100;
      const topPct = (svgY / 340) * 100;

      ['topOverlay', 'bottomOverlay'].forEach(id => {
        const ring = document.createElement('div');
        ring.className = 'found-ring';
        ring.style.left = `${leftPct}%`;
        ring.style.top = `${topPct}%`;
        document.getElementById(id).appendChild(ring);
      });
    }

    function addMissCross(overlayEl, leftPct, topPct) {
      const cross = document.createElement('div');
      cross.className = 'miss-cross';
      cross.textContent = '✖';
      cross.style.left = `${leftPct}%`;
      cross.style.top = `${topPct}%`;
      overlayEl.appendChild(cross);
      setTimeout(() => cross.remove(), 550);
    }

    function updateHud() {
      const foundCount = state.foundSet.size;
      document.getElementById('hudProgressLabel').textContent = `已找出 ${foundCount} / ${state.targetCount} 處不同`;
      document.getElementById('hudMistakes').textContent = `${state.mistakes}`;

      const dotsContainer = document.getElementById('diffDots');
      dotsContainer.innerHTML = '';
      for (let i = 0; i < state.targetCount; i++) {
        const dot = document.createElement('span');
        dot.className = `diff-dot ${i < foundCount ? 'found' : ''}`;
        dotsContainer.appendChild(dot);
      }
    }

    function onAllFound() {
      state.isPlaying = false;
      clearInterval(state.timerId);
      sfx.win();

      const totalSec = Number((state.elapsedMs / 1000).toFixed(1));
      const key = getBestKey();
      const prev = localStorage.getItem(key);
      let isNewRecord = false;
      if (!prev || totalSec < parseFloat(prev)) {
        localStorage.setItem(key, String(totalSec));
        isNewRecord = true;
      }

      let stars = 3;
      if (state.mistakes >= 5) stars = 1;
      else if (state.mistakes >= 2) stars = 2;

      setTimeout(() => {
        document.getElementById('resultBadge').textContent = isNewRecord ? '🏆 刷新最快找碴紀錄！' : '🎉 全部找出來了！';
        document.getElementById('resultStarsBig').textContent = '⭐'.repeat(stars) + '☆'.repeat(3 - stars);
        document.getElementById('statTime').textContent = `${totalSec.toFixed(1)} 秒`;
        document.getElementById('statMistakes').textContent = `${state.mistakes} 次`;
        updateBestRecordUI();
        switchScreen('result');
      }, 550);
    }

    // ====== 事件綁定 ======
    document.getElementById('topPanel').addEventListener('pointerdown', (e) => {
      handlePanelClick(e, e.currentTarget);
    });

    document.getElementById('bottomPanel').addEventListener('pointerdown', (e) => {
      handlePanelClick(e, e.currentTarget);
    });

    document.getElementById('countSelector').addEventListener('click', (e) => {
      const card = e.target.closest('.option-card');
      if (!card) return;
      document.querySelectorAll('#countSelector .option-card').forEach(c => c.classList.remove('selected'));
      card.classList.add('selected');
      state.targetCount = Number(card.dataset.count);
      updateBestRecordUI();
    });

    document.getElementById('startBtn').addEventListener('click', startGame);
    document.getElementById('retrySameBtn').addEventListener('click', startGame);
    document.getElementById('nextSceneBtn').addEventListener('click', () => {
      state.sceneIdx = (state.sceneIdx + 1) % SCENES.length;
      renderSceneGallery();
      updateBestRecordUI();
      startGame();
    });

    document.getElementById('quitBtn').addEventListener('click', () => {
      state.isPlaying = false;
      clearInterval(state.timerId);
      switchScreen('start');
    });

    document.getElementById('soundToggleBtn').addEventListener('click', (e) => {
      sfx.enabled = !sfx.enabled;
      e.currentTarget.textContent = sfx.enabled ? '🔊' : '🔇';
    });

    renderSceneGallery();
    updateBestRecordUI();
  </script>
